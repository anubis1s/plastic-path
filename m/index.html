<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мышцы конечностей — Oral quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1f2430;--muted:#687083;--line:#dfe4ec;--acc:#2f5aa0;--acc-soft:#e6eefa;--good:#2f7d5b;--good-soft:#e4f3ec;--bad:#b5503f;--bad-soft:#f9e8e4;--warn:#8a6a12;--warn-soft:#fbf3dc;--r:16px}
@media (prefers-color-scheme:dark){:root{--bg:#15171c;--card:#1e2128;--ink:#e9ebf0;--muted:#a0a6b4;--line:#30343e;--acc:#8fb0ec;--acc-soft:#1f2a3d;--good:#6cc49a;--good-soft:#1d3229;--bad:#e28b7b;--bad-soft:#3a2420;--warn:#e3c56d;--warn-soft:#352e1a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 80px}
h1{font-size:1.4rem;margin:6px 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;font-size:.85rem;padding:7px;border-radius:10px;cursor:pointer}.seg button.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.wl td{font-size:.86rem}.wl td:first-child{min-width:150px}.wl tr.k td{color:var(--muted)}.wl input{width:18px;height:18px;accent-color:var(--good)}
@media (max-width:620px){.wl thead{display:none}.wl tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}.wl td{display:block;border:0;padding:2px 0}.wl td[data-l]:before{content:attr(data-l)": ";font-weight:700;color:var(--acc)}}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:.78rem;padding:8px 2px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){.tabs button.on,.btn.p,.num{color:#15171c!important}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:.82rem;cursor:pointer}
.chip.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.gh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:18px 0 4px}
.gh h2{font-size:1.1rem;margin:0}
.gh span{color:var(--muted);font-size:.85rem}
.m h3{margin:0 0 2px;font-size:1.02rem}
.m .ru{color:var(--muted);font-size:.85rem;margin-bottom:10px}
.row{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:.95rem}
.k{font-weight:700;color:var(--acc)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.88rem;margin-top:10px}
.tip{background:var(--acc-soft);border-left:4px solid var(--acc);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:.93rem}
.flash{min-height:270px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.flash .front h3{font-size:1.45rem;margin:0}
.flash .front .ru{color:var(--muted);margin-top:4px}
.flash .hint{color:var(--muted);font-size:.8rem;margin-top:18px}
.flash .back{text-align:left}
.flash .back h3{margin:0 0 6px;font-size:1.1rem}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;font:inherit;font-weight:600;font-size:.95rem;border-radius:12px;padding:12px 14px;cursor:pointer}
.btn.p{background:var(--acc);color:#fff}
.btn.g{background:var(--good-soft);color:var(--good)}
.btn.b{background:var(--bad-soft);color:var(--bad)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.prog{color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;margin:8px 2px}
.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--good);width:0;transition:width .3s}
.q{font-size:1.05rem;font-weight:600;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:11px 13px;font:inherit;font-size:.95rem;cursor:pointer}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;font-size:.92rem;border-radius:10px;padding:10px 12px}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.big{font-size:2.2rem;font-weight:700;margin:0}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:.78rem;text-transform:uppercase}
.mist li{margin:6px 0}
.pic{display:block;width:100%;max-height:260px;object-fit:contain;background:#fff;border-radius:12px;border:1px solid var(--line);margin:4px 0 10px}
.pic.big{max-height:420px}
.cap{color:var(--muted);font-size:.78rem;margin:-6px 0 10px}
.steplist{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.st{flex:1;min-width:60px;text-align:center;font-size:.75rem;font-weight:600;padding:6px 4px;border-radius:8px;background:var(--line);color:var(--muted)}
.st.cur{background:var(--acc-soft);color:var(--acc)}
.st.ok{background:var(--good-soft);color:var(--good)}
.st.no{background:var(--bad-soft);color:var(--bad)}
.lab{display:grid;grid-template-columns:34px 1fr 44px;gap:8px;align-items:center;margin:8px 0}
.num{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.lab input{font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
.lab input.ok{border-color:var(--good);background:var(--good-soft)}
.lab input.no{border-color:var(--bad);background:var(--bad-soft)}
.lab button{height:42px;border:0;border-radius:10px;background:var(--acc-soft);color:var(--acc);font-weight:700;font-size:1rem;cursor:pointer}
.ans{grid-column:2/4;font-size:.85rem;margin:-4px 0 4px}
.ans.ok{color:var(--good)} .ans.no{color:var(--bad)}
.mov{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}.mov figure{margin:0;background:var(--acc-soft);border-radius:12px;padding:6px 6px 8px}.mov figcaption{font-size:.8rem;font-weight:600;color:var(--acc);text-align:center}.vid{display:block;margin-top:8px;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--line);color:var(--acc);font-weight:600;font-size:.9rem;text-decoration:none}
.hintbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.88rem;margin-top:10px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../theme.css">
<script>document.addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG'){t.style.display='none';if(!t.dataset.n){t.dataset.n=1;const d=document.createElement('div');d.className='cap';d.textContent='Картинка доступна в версии Claude';t.after(d)}}},true);</script>
</head>
<body>
<div class="wrap">
  <h1>Мышцы конечностей — Oral quiz</h1>
  <p class="sub">Верхняя (43) + нижняя (42) • O = origin, I = insertion, A = action, N = nerve</p>
  <div class="bar">
    <div class="seg" id="seg"></div>
    <div class="tabs" id="tabs">
      <button data-v="what">📋 Что учить</button>
      <button data-v="saq">🏷 SAQ</button>
      <button data-v="id">🔍 Узнай</button>
      <button data-v="learn">📖 Учить</button>
      <button data-v="steps">🪜 Пошагово</button>
      <button data-v="cards">🃏 Карточки</button>
      <button data-v="quiz">✏️ Тест</button>
      <button data-v="nerves">⚡ Нервы</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <main id="view"></main>
</div>
<script src="motion.js"></script>
<script>

 {img:"u_sup",g:"pff",n:"m. supinator",ru:"супинатор",o:"Lateral epicondyle, radial collateral + annular ligaments, supinator crest of ulna",i:"Proximal third of radius (lateral)",a:"Supination of forearm",nv:"Deep branch of radial nerve",note:"Сверх таблицы преподавателя. Deep branch радиального нерва проходит сквозь него."},

let quiz=null;
function makeQ(m){
  const types=QT.filter(t=>t.f==="rev"||m[t.f]);
  const t=types[Math.floor(Math.random()*types.length)];
  let correct,others;
  if(t.f==="rev"){
    correct=m.n;
    const same=M.filter(x=>x.id!==m.id&&!(x.a===m.a&&x.nv===m.nv));
    others=shuffle(same.filter(x=>x.g===m.g)).concat(shuffle(same.filter(x=>x.g!==m.g))).map(x=>x.n);
  } else {
    correct=m[t.f];
    const vals=M.filter(x=>x[t.f]&&x[t.f]!==correct);
    others=shuffle(vals.filter(x=>x.g===m.g)).concat(shuffle(vals.filter(x=>x.g!==m.g))).map(x=>x[t.f]);
  }
  const uniq=[...new Set(others)].slice(0,3);
  return {m,t,text:t.q(m),correct,opts:shuffle([correct,...uniq]),picked:null};
}

const norm=t=>t.toLowerCase().replace(/\b(mm?|musculus|musculi|muscles?)\b\.?/g," ").replace(/[^a-z]/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}

  if(order.length>1){const ix=order.indexOf(key);h+=`<div class="fbtns" style="margin-top:10px"><button class="btn ghost" id="pv" ${ix===0?"disabled":""}>← Предыдущая</button><button class="btn p" id="nxp" ${ix===order.length-1?"disabled":""}>Следующая картинка →</button></div>`;}
  h+=`</div>`;

  const check=i=>{const v=$("#in"+i).value;if(!v.trim())return;R[i]={t:v,v:judge(v,S.ans[i])};saq();const nx=$("#in"+(i+1));if(nx&&!R[i+1])nx.focus();};
  S.ans.forEach((_,i)=>{const el=$("#in"+i);el.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check(i);}};});
  document.querySelectorAll(".lab button").forEach(b=>b.onclick=()=>check(+b.dataset.i));
  $("#sh").onclick=()=>{S.ans.forEach((a,i)=>{if(!R[i])R[i]={t:"",v:0};});saq();};
  $("#rs").onclick=()=>{saqRes[key]={};saq();};
  if($("#pv"))$("#pv").onclick=()=>{saqKey=order[order.indexOf(key)-1];saq();window.scrollTo({top:0});};
  if($("#nxp"))$("#nxp").onclick=()=>{saqKey=order[order.indexOf(key)+1];saq();window.scrollTo({top:0});};
}
/* IDENTIFY: highlighted muscle */
let idq=null;
function newId(){const p=shuffle(group==="all"?IDQ.filter(inReg):IDQ.filter(m=>m.g===group));idq={list:p,i:0,score:0,picked:null,g:group+region,opts:null};}
function idV(){
  if(!idq||idq.g!==group+region) newId();
  if(!idq.list.length){$("#view").innerHTML=`<div class="card"><p>В этой группе нет отдельных картинок — выбери другую группу или «Все».</p></div>`;return;}
  if(idq.i>=idq.list.length){$("#view").innerHTML=`<div class="card" style="text-align:center"><p class="big">${idq.score} / ${idq.list.length}</p><button class="btn p" id="ir">Ещё раз</button></div>`;$("#ir").onclick=()=>{newId();idV();};return;}
  const m=idq.list[idq.i];
  if(!idq.opts){const same=M.filter(x=>x.id!==m.id);idq.opts=shuffle([m.n,...shuffle(same.filter(x=>x.g===m.g)).concat(shuffle(same.filter(x=>x.g!==m.g))).slice(0,3).map(x=>x.n)]);}
  const pk=idq.picked;
  let h=`<div class="prog"><span>Картинка ${idq.i+1} из ${idq.list.length}</span><span>Верно: ${idq.score}</span></div>
  <div class="card"><p class="q">Какая мышца на картинке (выделена цветом)?</p><img class="pic big" src="img/${m.img}.jpg" alt="?"><div class="opts">${idq.opts.map((o,j)=>{let c="opt";if(pk!==null){if(o===m.n)c+=" right";else if(o===pk)c+=" wrong";}return `<button class="${c}" data-j="${j}" ${pk!==null?'disabled':''}>${esc(o)}</button>`}).join("")}</div>`;
  if(pk!==null) h+=`<div class="fb ${pk===m.n?'ok':'no'}">${pk===m.n?"Верно!":"Это <b>"+esc(m.n)+"</b>"}</div>${rows(m)}<div style="margin-top:12px"><button class="btn p" id="inx" style="width:100%">Дальше →</button></div>`;
  h+=`</div>`;
  $("#view").innerHTML=h;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{idq.picked=idq.opts[+b.dataset.j];if(idq.picked===m.n)idq.score++;idV();});
  if($("#inx"))$("#inx").onclick=()=>{idq.i++;idq.picked=null;idq.opts=null;idV();window.scrollTo({top:0});};
}
/* STEPS */
const SF=[["o","Origin","Начало"],["i","Insertion","Прикрепление"],["a","Action","Функция"],["nv","Nerve","Нерв"]];
let sd=null;
function optsFor(m,f){const vals=M.filter(x=>x[f]&&x[f]!==m[f]);const o=[...new Set(shuffle(vals.filter(x=>x.g===m.g)).concat(shuffle(vals.filter(x=>x.g!==m.g))).map(x=>x[f]))].slice(0,3);return shuffle([m[f],...o]);}
function newSteps(){ sd={list:shuffle(pool()),k:0,score:0,total:0,g:group+region}; startMuscle(); }
function startMuscle(){const m=sd.list[sd.k]; if(!m) return; sd.fields=SF.filter(f=>m[f[0]]); sd.s=0; sd.res=[]; sd.opts=sd.fields.map(f=>optsFor(m,f[0])); sd.picked=null;}
function steps(){
  if(!sd||sd.g!==group+region) newSteps();
  if(sd.k>=sd.list.length){
    $("#view").innerHTML=`<div class="card" style="text-align:center"><p class="big">${sd.score} / ${sd.total}</p><p>шагов верно</p><button class="btn p" id="sr">Начать заново</button></div>`;
    $("#sr").onclick=()=>{newSteps();steps();}; return;
  }
  const m=sd.list[sd.k], done=sd.s>=sd.fields.length;
  let h=`<div class="prog"><span>Мышца ${sd.k+1} из ${sd.list.length}</span><span>Верно шагов: ${sd.score} / ${sd.total}</span></div>
  <div class="card"><h3 style="margin:0">${esc(m.n)}</h3><div class="ru" style="color:var(--muted);font-size:.85rem;margin-bottom:8px">${esc(m.ru)}</div>${pic(m)}
  <div class="steplist">${sd.fields.map((f,j)=>`<div class="st ${j<sd.s?(sd.res[j]?'ok':'no'):j===sd.s?'cur':''}">${j+1}. ${f[1]}</div>`).join("")}</div>`;
  if(!done){
    const [f,en,ru]=sd.fields[sd.s], opts=sd.opts[sd.s], pk=sd.picked;
    h+=`<p class="q">Шаг ${sd.s+1}: ${en} / ${ru}?</p><div class="opts">${opts.map((o,j)=>{let c="opt";if(pk!==null){if(o===m[f])c+=" right";else if(o===pk)c+=" wrong";}return `<button class="${c}" data-j="${j}" ${pk!==null?'disabled':''}>${esc(o)}</button>`}).join("")}</div>`;
    if(pk===null){ const t=tipFor(f,m); if(t) h+=`<details style="margin-top:10px"><summary style="cursor:pointer;color:var(--muted);font-size:.88rem">💡 Подсказка</summary><div class="hintbox">${esc(t)}</div></details>`; }
    else {
      const ok=pk===m[f];
      h+=`<div class="fb ${ok?'ok':'no'}">${ok?"✓ Верно!":"✗ Неверно. Правильно: <b>"+esc(m[f])+"</b>"}</div>`;
      const t=tipFor(f,m); if(t) h+=`<div class="hintbox">💡 ${esc(t)}</div>`;
      h+=`<div style="margin-top:12px"><button class="btn p" id="sn" style="width:100%">${sd.s+1<sd.fields.length?"Следующий шаг →":"Итог по мышце →"}</button></div>`;
    }
  } else {
    h+=`<div class="fb ${sd.res.every(Boolean)?'ok':'no'}">${sd.res.every(Boolean)?"Все шаги верно!":"Есть ошибки — запомни правильные ответы:"}</div>${rows(m)}<div style="margin-top:12px"><button class="btn p" id="nm" style="width:100%">Следующая мышца →</button></div>`;
  }
  h+=`</div>`;
  $("#view").innerHTML=h;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const f=sd.fields[sd.s][0];sd.picked=sd.opts[sd.s][+b.dataset.j];const ok=sd.picked===m[f];sd.res.push(ok);sd.total++;if(ok)sd.score++;steps();});
  if($("#sn")) $("#sn").onclick=()=>{sd.s++;sd.picked=null;steps();window.scrollTo({top:0});};
  if($("#nm")) $("#nm").onclick=()=>{sd.k++;startMuscle();steps();window.scrollTo({top:0});};
}
/* NERVES */
function ntab(t,rows){return `<div class="card"><h3 style="margin-top:0">${t}</h3><table><tr><th>Группа / мышца</th><th>Нерв</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td></tr>`).join("")}</table></div>`}
function nerves(){
  let h="";
  if(region!=="le") h+=ntab("Верхняя конечность",UNERVES);
  if(region!=="ul") h+=ntab("Нижняя конечность",LNERVES)+`<div class="tip">Голень: <b>каждый отдел — свой нерв</b> (передний — deep fibular, латеральный — superficial fibular, задний — tibial).</div>`;
  $("#view").innerHTML=h+`<div class="tip">Выучи эти таблицы первыми: они закрывают нерв почти у всех мышц.</div>`;
}
/* WHAT TO LEARN */
function what(){
  const gs=Object.keys(GROUPS).filter(g=>(region==="all"||GROUPS[g].r===region)&&(group==="all"||g===group));
  const ms=M.filter(m=>gs.includes(m.g)); const kn=ms.filter(m=>known.has(m.id)).length;
  let h=`<div class="tip"><b>Что выучить к oral quiz:</b> по каждой мышце ниже — название (лат./англ.) и 4 пункта в этом порядке: <b>Origin → Insertion → Action → Nerve</b>. У мышц кисти и стопы origin/insertion добавлены по стандартному курсу — главное в них Action и Nerve. Отмечай галочкой, когда отвечаешь вслух без ошибок.</div>
  <div class="prog"><span>Выучено: ${kn} из ${ms.length}</span><span>${Math.round(kn/ms.length*100)}%</span></div><div class="track"><div class="fill" style="width:${kn/ms.length*100}%"></div></div>`;
  let lastR=null;
  gs.forEach(g=>{
    const G=GROUPS[g];
    if(G.r!==lastR){lastR=G.r;h+=`<h2 style="margin:22px 0 0">${G.r==="ul"?"Верхняя конечность — "+M.filter(m=>m.r==="ul").length+" мышц":"Нижняя конечность — "+M.filter(m=>m.r==="le").length+" мышц"}</h2>`;}
    const gm=M.filter(m=>m.g===g);
    h+=`<div class="card"><h3 style="margin:0 0 6px">${G.en} / ${G.ru} · ${gm.length}</h3>${GTIP[g]?`<div class="tip" style="margin-top:4px">${GTIP[g]}</div>`:""}<table class="wl"><thead><tr><th></th><th>Мышца</th><th>O</th><th>I</th><th>A</th><th>N</th></tr></thead><tbody>${gm.map(m=>`<tr class="${known.has(m.id)?"k":""}"><td><input type="checkbox" data-k="${m.id}" ${known.has(m.id)?"checked":""} aria-label="выучил"></td><td><b>${esc(m.n)}</b><br><span style="color:var(--muted)">${esc(m.ru)}</span></td><td data-l="O">${esc(m.o||"—")}</td><td data-l="I">${esc(m.i||"—")}</td><td data-l="A">${esc(m.a)}</td><td data-l="N"><b>${esc(m.nv)}</b></td></tr>`).join("")}</tbody></table></div>`;
  });
  $("#view").innerHTML=h;
  document.querySelectorAll("[data-k]").forEach(c=>c.onchange=()=>{const id=+c.dataset.k;if(c.checked)known.add(id);else known.delete(id);store.set("allm-known",[...known]);const y=scrollY;what();scrollTo(0,y);});
}
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  chips();
  if(view==="saq") saq();
  else if(view==="id") idV();
  else if(view==="learn") learn();
  else if(view==="steps") steps();
  else if(view==="cards"){ if(deck._g!==group+region) newDeck(); cards(); }
  else if(view==="what") what();
  else if(view==="quiz") quizV();
  else nerves();
  window.scrollTo({top:0});
}
const VIEWS=["what","saq","id","learn","steps","cards","quiz","nerves"];
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{view=b.dataset.v;try{history.replaceState(null,"","#"+view)}catch(e){}render();});
const h0=location.hash.slice(1); if(VIEWS.includes(h0)) view=h0;
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS.includes(h)&&h!==view){view=h;render();}});
render();
</script>
